    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#101d35"/><stop offset=".48" stop-color="#293750"/><stop offset=".84" stop-color="#aa7f83"/><stop offset="1" stop-color="#dbad98"/></linearGradient>
    <linearGradient id="water" x2=".18" y2="1"><stop stop-color="#496778"/><stop offset=".45" stop-color="#273d54"/><stop offset="1" stop-color="#101e31"/></linearGradient>
