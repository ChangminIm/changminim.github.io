<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="light"><title>아이걸음 · 내부 연구 보고서</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f4;color:#183127;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100dvh;display:grid;place-items:center;padding:24px}
main{width:100%;max-width:460px;padding:40px;background:white;border:1px solid #dce6de;border-radius:16px;box-shadow:0 8px 40px #15352208}
.eyebrow{font-size:13px;font-weight:700;color:#527460;letter-spacing:.06em}h1{font-size:27px;line-height:1.3;margin:14px 0}p{font-size:15px;line-height:1.7;color:#65746b;margin:0 0 25px}label{display:block;font-size:14px;font-weight:650;margin-bottom:9px}input{width:100%;font:inherit;padding:13px;border:1px solid #bfcec2;border-radius:8px}input:focus{outline:3px solid #d9ebdc;border-color:#39724b}button{width:100%;margin-top:15px;border:0;border-radius:8px;background:#2b7044;color:white;font:inherit;font-weight:650;padding:14px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#status{font-size:14px;line-height:1.5;min-height:23px;margin:18px 0 0}.error{color:#ad3e32!important}.footer{font-size:12px;color:#839086;border-top:1px solid #edf0ed;padding-top:20px;margin:22px 0 0}
</style></head><body><main>
<div class="eyebrow">아이걸음 · 내부 연구진 회의용</div>
<h1>누적 경로와<br>기초분석</h1>
<p>공유받은 암호를 입력하면<br>지도와 분석 보고서를 열 수 있습니다.</p>
<form id="unlock"><label for="password">보고서 암호</label><input id="password" type="password" autocomplete="off" spellcheck="false" required autofocus><button type="submit" id="open">보고서 열기</button></form>
<div id="status" role="status" aria-live="polite"></div>
<div class="footer">자료 기준: 2026년 9월 16일</div>
</main><script>
const config = {"file": "report.enc?v=69535a3545767d85", "salt": "P76HQ3KtZBlnbjwnisGWyQ==", "iv": "TWHtolPtkyh46jWn", "iterations": 600000, "sha256": "1ba940ed6421c59e33c36c7b6c24bb8c17c2f3ec3425bc0ac8b998ad25760ee6"};
const bytes = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
document.getElementById('unlock').addEventListener('submit', async event=>{
  event.preventDefault();
  const status=document.getElementById('status'), button=document.getElementById('open');
  let password=document.getElementById('password').value;
  button.disabled=true;status.className='';status.textContent='보고서를 불러오고 있습니다…';
  let phase='download';
  try {
    if(!crypto.subtle || typeof DecompressionStream==='undefined') throw new Error('unsupported');
    const response=await fetch(config.file, {credentials:'omit'});
    if(!response.ok) throw new Error('download');
    const encrypted=await response.arrayBuffer();
    phase='unlock';status.textContent='암호를 확인하고 있습니다…';
    const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
    password='';
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(config.salt),iterations:config.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
    const compressed=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(config.iv),additionalData:new TextEncoder().encode('tracker-analysis-v1')},key,encrypted);
    phase='open';status.textContent='지도와 표를 준비하고 있습니다…';
    const plain=await new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
    const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',plain)),b=>b.toString(16).padStart(2,'0')).join('');
    if(digest!==config.sha256) throw new Error('integrity');
    document.getElementById('password').value='';
    const html=new TextDecoder().decode(plain);
    document.open();document.write(html);document.close();
  } catch(error) {
    button.disabled=false;status.className='error';
    status.textContent=error.message==='unsupported'?'최신 Chrome, Edge 또는 Safari에서 열어 주세요.':phase==='unlock'?'암호가 맞지 않습니다. 공유받은 암호를 다시 입력해 주세요.':phase==='download'?'보고서를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 다시 시도해 주세요.':'보고서를 열지 못했습니다. 새로고침 후 다시 시도해 주세요.';
  }
});
</script></body></html>
